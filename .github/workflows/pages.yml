# Rebuild the extension index from each repo's latest release and publish it
# to GitHub Pages. Runs daily, on pushes to main and from the Actions tab.
name: Publish index

on:
  push:
    branches: [main]
  schedule:
    - cron: "23 7 * * *"
  workflow_dispatch:
  # Lets an extension's release workflow trigger a rebuild (needs a token
  # with access to this repo; see README).
  repository_dispatch:
    types: [extension-released]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  BLENDER_VERSION: "5.2.3"
  BLENDER_DIR: ${{ github.workspace }}/../blender

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Cache Blender
        id: blender-cache
        uses: actions/cache@v4
        with:
          path: ${{ env.BLENDER_DIR }}
          key: blender-${{ env.BLENDER_VERSION }}-linux-x64

      - name: Download Blender
        if: steps.blender-cache.outputs.cache-hit != 'true'
        run: |
          minor=${BLENDER_VERSION%.*}
          mkdir -p "$BLENDER_DIR"
          curl -fsSL "https://download.blender.org/release/Blender$minor/blender-$BLENDER_VERSION-linux-x64.tar.xz" \
            | tar -xJ --strip-components=1 -C "$BLENDER_DIR"

      # Blender links these X/GL libraries even in background mode.
      - name: Install Blender's runtime libraries
        run: |
          sudo apt-get update -q
          sudo apt-get install -qy --no-install-recommends \
            libx11-6 libxi6 libxxf86vm1 libxfixes3 libxrender1 libxkbcommon0 libsm6 libgl1 libegl1

      - name: Build the index
        env:
          GH_TOKEN: ${{ github.token }}
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
        run: |
          scripts/build_index.sh "$BLENDER_DIR/blender" site
          cat site/index.json

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
